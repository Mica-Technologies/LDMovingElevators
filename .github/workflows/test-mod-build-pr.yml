# Mica Technologies standard PR build check.
#
# Fork delta vs the sibling mods: two JDKs are installed, because Gradle needs 17+ for
# ForgeGradle 6 while the mod itself compiles against a Java 8 toolchain (java_target=8).

name: Test Mod Build (Pull Request)

on: pull_request

permissions:
  contents: read

jobs:
  test_assemble_mod:
    name: Test Assemble Mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Up JDKs (8 for the mod toolchain, 17 to run Gradle)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: |
            8
            17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble mod with Gradle
        run: ./gradlew build -Dhttp.socketTimeout=60000 -Dhttp.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.http.connectionTimeout=60000

  # Separate job: needs no JDK and finishes in seconds, so it reports independently of the build
  # rather than queueing behind a full Minecraft decompile.
  test_release_tooling:
    name: Test Release Tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run release tooling checks
        run: .github/scripts/test-release-tooling.sh

      # City Super Mod is compile-only, so a stray import of it builds fine and then crashes at
      # runtime for everyone who has not installed CSM. Neither the compiler nor a dev run catches
      # that, because both have CSM on the classpath.
      - name: Check CSM stays optional
        run: .github/scripts/test-csm-containment.sh
