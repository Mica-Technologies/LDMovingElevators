# Mica Technologies standard PR build check.
#
# Fork delta vs the sibling mods: two JDKs are installed, because Gradle needs 17+ for
# ForgeGradle 6 while the mod itself compiles against a Java 8 toolchain (java_target=8).

name: Test Mod Build (Pull Request)

# Also dispatchable by hand, for a branch that GitHub left without a check run.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs on the same PR are pointless -- the server smoke test is slow.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test_assemble_mod:
    name: Test Assemble Mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Up JDKs (8 for the mod toolchain, 17 to run Gradle)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: |
            8
            17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble mod with Gradle
        run: ./gradlew build -Dhttp.socketTimeout=60000 -Dhttp.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.http.connectionTimeout=60000

  server_smoke_test:
    name: Dedicated Server Smoke Test
    needs: test_assemble_mod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Up JDKs (8 for the mod toolchain, 17 to run Gradle)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: |
            8
            17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # `./gradlew build` passing proves nothing about whether the mod can LOAD on a
      # dedicated server: client-only classes reached from common code, a mixin listed under
      # `mixins` rather than `client`, or a Side.CLIENT packet handler touching Minecraft
      # directly all compile cleanly and only fail at server startup. This mod's players are
      # on dedicated servers, so that is the configuration that has to boot.
      - name: Boot dedicated server and assert startup
        run: bash .github/scripts/server-smoke-test.sh
        env:
          SMOKE_TIMEOUT: '1200'

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-smoke-logs
          path: |
            server-smoke.log
            run/server/logs/
            run/server/crash-reports/
          retention-days: 7

  # Separate job: needs no JDK and finishes in seconds, so it reports independently of the build
  # rather than queueing behind a full Minecraft decompile.
  test_release_tooling:
    name: Test Release Tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run release tooling checks
        run: .github/scripts/test-release-tooling.sh

      # City Super Mod is compile-only, so a stray import of it builds fine and then crashes at
      # runtime for everyone who has not installed CSM. Neither the compiler nor a dev run catches
      # that, because both have CSM on the classpath.
      - name: Check CSM stays optional
        run: .github/scripts/test-csm-containment.sh
