# Mica Technologies standard mod release workflow.
#
# Fork deltas vs the sibling mods (LDOG/RCMC/CSM) -- everything else is verbatim so this
# stays diffable against them:
#   * This repo's default branch is `forge-1.12`, not `main`/`master`. Upstream keeps one
#     branch per loader+MC version and we only support Forge 1.12, so `forge-1.12` is the
#     "main" branch in fleet terms. The workflow name is left unchanged because
#     cleanup-mod-pre-releases.yml keys its workflow_run trigger off it.
#   * Two JDKs are installed: Gradle itself needs 17+ for ForgeGradle 6, while the mod
#     compiles against a Java 8 toolchain (java_target=8).
#   * The print* task reads use `tail -n 1` because build.gradle prints a JVM banner during
#     configuration that `-q` does not suppress.
#   * The version is pinned with `-PmodVersionOverride` rather than by editing
#     buildscript.properties: this is a hand-written ForgeGradle build, not the GregTechCEu
#     buildscript, and build.gradle reads that property before it asks git anything.
#   * One jar, so the release carries a single asset and its hashes go in the body rather
#     than in a SHA256SUMS.txt.

name: Build Mod Release/Pre-Release (Main Branch)

on:
  push:
    branches:
      - forge-1.12
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a full release'
        required: false
        default: 'false'

# Needed to push the release tag and publish the release entry.
permissions:
  contents: write

jobs:
  assemble_release:
    name: Build Mod and Publish Release/Pre-Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Up JDKs (8 for the mod toolchain, 17 to run Gradle)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: |
            8
            17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create Version Numbers
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$calculatedSha" >> $GITHUB_ENV

          # Calculate 'final' version number (YYYY.MM.DD).
          # If a release tag already exists for today, append SemVer 2.0
          # build metadata (+N) so subsequent same-day releases stay unique
          # without inventing a non-SemVer 4th segment.
          baseVersion=$(date -u +'%Y.%m.%d')
          git fetch --tags --quiet origin || true
          relVersion="$baseVersion"
          maxN=-1
          if git rev-parse -q --verify "refs/tags/$baseVersion" >/dev/null 2>&1; then
            maxN=0
          fi
          for existingTag in $(git tag -l "${baseVersion}+*"); do
            suffix="${existingTag#${baseVersion}+}"
            if [[ "$suffix" =~ ^[0-9]+$ ]] && [ "$suffix" -gt "$maxN" ]; then
              maxN="$suffix"
            fi
          done
          if [ "$maxN" -ge 0 ]; then
            relVersion="${baseVersion}+$((maxN + 1))"
          fi
          echo "REL_TAG=$relVersion" >> $GITHUB_ENV

          # Calculate 'pre-release' version number (YYYY.MM.DD-pre.hhmm.shorttz+COMMITSHORTSHA)
          preReleaseVersion=$(date -u +'%Y.%m.%d-pre.%H%M.%Z%z')"+$calculatedSha"
          echo "PRE_TAG=$preReleaseVersion" >> $GITHUB_ENV

      # Our releases are date-versioned, which on its own says nothing about which upstream
      # release the build corresponds to. The logic lives in a script rather than inline here so
      # that .github/scripts/test-release-tooling.sh can exercise it, including its failure paths.
      - name: Extract Upstream Lineage
        run: .github/scripts/extract-upstream-lineage.sh

      - name: Create Release Tag
        if: ${{ github.event.inputs.release == 'true' && github.event.inputs.release }}
        run: |
          git tag "${{ env.REL_TAG }}" "${{ github.sha }}"
          git push origin "${{ env.REL_TAG }}"

      - name: Create Pre-Release Tag
        if: ${{ github.event.inputs.release == 'false' || !github.event.inputs.release }}
        run: |
          git tag "${{ env.PRE_TAG }}" "${{ github.sha }}"
          git push origin "${{ env.PRE_TAG }}"

      # The version the jar is stamped with is resolved by build.gradle from the tags on HEAD. A
      # dispatched release and a pushed pre-release of the same commit leave BOTH tags on it --
      # 2026.08.20 and 2026.08.20-pre.2353.UTC+0000+2ae560d8 both point at 2ae560d8 today -- and
      # build.gradle picks between them by its own rule (a release tag outranks a pre-release
      # tag). That rule happens to be right, but it is still the build guessing at what this
      # workflow already knows. The same guess, made by `git describe` with no preference at all,
      # shipped an MCMCP release stamped as a pre-release on 2026-09-09 and was latent in CSM.
      #
      # So the version is STATED rather than inferred: build.gradle reads -PmodVersionOverride
      # before it asks git anything, and every Gradle invocation below that cares about the
      # version passes it. Nothing is edited or committed.
      - name: Pin the mod version to the tag being published
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.release }}" = "true" ]; then
            chosen="${{ env.REL_TAG }}"
          else
            chosen="${{ env.PRE_TAG }}"
          fi
          echo "CHOSEN_TAG=$chosen" >> "$GITHUB_ENV"
          echo "Pinning mod version to $chosen"

          # Belt and braces: any Gradle invocation that forgets the override falls back to the
          # tags on HEAD, so the other tags on this commit go too. Local refs only: the remote
          # tags, and so the release history, are untouched. `|| true` because grep exits 1 when
          # the chosen tag is the only one on the commit, which is the ordinary pre-release case.
          others="$(git tag --points-at "${{ github.sha }}" | grep -vxF "$chosen" || true)"
          if [ -n "$others" ]; then
            echo "$others" | xargs git tag -d
          fi
          echo "Local tags now on this commit:"
          git tag --points-at "${{ github.sha }}"

      - name: Assemble Mod with Gradle
        run: ./gradlew build -PmodVersionOverride="${{ env.CHOSEN_TAG }}" -Dhttp.socketTimeout=60000 -Dhttp.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.http.connectionTimeout=60000

      - name: Save Mod Name to GITHUB_ENV
        run: |
          modName=$(${{github.workspace}}/gradlew -q printModName | tail -n 1 | xargs)
          echo "MOD_NAME=$modName" >> $GITHUB_ENV

      # This is the full project version (`<tag>-forge-mc1.12`), which is what names the jar.
      - name: Save Mod Version to GITHUB_ENV
        run: |
          modVersion=$(${{github.workspace}}/gradlew -q printModVersion -PmodVersionOverride="${{ env.CHOSEN_TAG }}" | tail -n 1 | xargs)
          echo "MOD_VERSION=$modVersion" >> $GITHUB_ENV

      - name: Save Minecraft Version to GITHUB_ENV
        run: |
          minecraftVersion=$(${{github.workspace}}/gradlew -q printMinecraftVersion | tail -n 1 | xargs)
          echo "MINECRAFT_VERSION=$minecraftVersion" >> $GITHUB_ENV

      # Shape validation cannot catch a version that is well formed but simply not the one being
      # published, so this compares against the intended value. It runs before anything is
      # uploaded, because the version is baked into mcmod.info as well as the file name -- a
      # wrong one cannot be fixed by renaming the asset afterwards.
      #
      # The project version carries a `-forge-<minecraft_suffix>` tail after the tag, so the
      # expected value is assembled from gradle.properties rather than compared as a prefix: a
      # prefix check would pass a pre-release tag against the release tag it extends.
      - name: Fail if the built version is not the tag being published
        run: |
          set -euo pipefail
          built="${{ env.MOD_VERSION }}"
          suffix="$(sed -n 's/^minecraft_suffix=//p' gradle.properties | tr -d '[:space:]')"
          expected="${{ env.CHOSEN_TAG }}-forge-${suffix}"
          if [ "$built" != "$expected" ]; then
            echo "::error::Built version '$built' does not match the published tag '${{ env.CHOSEN_TAG }}' (expected '$expected'). The jar, and the mcmod.info inside it, would be stamped '$built'. Refusing to publish."
            exit 1
          fi
          echo "Built version matches the published tag: $built"

      - name: Save Mod Archive Base Name to GITHUB_ENV
        run: |
          modArchiveBaseName=$(${{github.workspace}}/gradlew -q printArchivesBaseName | tail -n 1 | xargs)
          echo "MOD_ARCHIVE_BASE_NAME=$modArchiveBaseName" >> $GITHUB_ENV

      - name: Copy Assembled Mod Jar to GitHub Actions Workspace
        run: |
          set -euo pipefail
          jar="${{ env.MOD_ARCHIVE_BASE_NAME }}-${{ env.MOD_VERSION }}.jar"
          if [ ! -f "build/libs/$jar" ]; then
            echo "::error::build/libs/$jar was not built"
            ls -la build/libs/ || true
            exit 1
          fi
          cp "build/libs/$jar" ./
          echo "RELEASE_JAR=$jar" >> "$GITHUB_ENV"

      - name: Calculate Hashes for the Jar
        id: calculate-hashes
        run: |
          sha1=$(sha1sum ./${{ env.RELEASE_JAR }} | awk '{print $1}')
          md5=$(md5sum ./${{ env.RELEASE_JAR }} | awk '{print $1}')
          sha256=$(sha256sum ./${{ env.RELEASE_JAR }} | awk '{print $1}')
          crc32=$(cksum ./${{ env.RELEASE_JAR }} | awk '{print $1}')
          echo "SHA1_HASH=$sha1" >> $GITHUB_ENV
          echo "MD5_HASH=$md5" >> $GITHUB_ENV
          echo "SHA256_HASH=$sha256" >> $GITHUB_ENV
          echo "CRC32_HASH=$crc32" >> $GITHUB_ENV

      - name: Create Release Entry
        if: ${{ github.event.inputs.release == 'true' && github.event.inputs.release }}
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.REL_TAG }}
          name: Release ${{ env.MOD_VERSION }} (${{ env.MINECRAFT_VERSION }})
          body: |
            Release of ${{ env.MOD_NAME }}
            Mod Version: ${{ env.MOD_VERSION }}
            Game Version: ${{ env.MINECRAFT_VERSION }}

            Based on upstream Moving Elevators ${{ env.UPSTREAM_BASE_VERSION }} by SuperMartijn642
            (https://github.com/SuperMartijn642/MovingElevators)

            ${{ env.UPSTREAM_RELEASE_NOTES }}

            SHA-1: `${{ env.SHA1_HASH }}`
            SHA-256: `${{ env.SHA256_HASH }}`
            MD5: `${{ env.MD5_HASH }}`
            CRC-32: `${{ env.CRC32_HASH }}`

            NOTICE: This is an unofficial fork of Moving Elevators by SuperMartijn642,
            maintained by Mica Technologies for Forge 1.12 only. It is not affiliated with
            or endorsed by SuperMartijn642. Do not report issues with this build to the
            upstream project.
          # Created as a draft with no files attached: the action's own uploader is what loses
          # assets (see the upload step below). It is filled and published from here instead.
          draft: true
          prerelease: false
          generate_release_notes: true

      - name: Create Pre-Release Entry
        if: ${{ github.event.inputs.release == 'false' || !github.event.inputs.release }}
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.PRE_TAG }}
          name: Pre-Release ${{ env.MOD_VERSION }} (${{ env.MINECRAFT_VERSION }})
          body: |
            Pre-Release of ${{ env.MOD_NAME }}
            Mod Version: ${{ env.MOD_VERSION }}
            Game Version: ${{ env.MINECRAFT_VERSION }}

            Based on upstream Moving Elevators ${{ env.UPSTREAM_BASE_VERSION }} by SuperMartijn642
            (https://github.com/SuperMartijn642/MovingElevators)

            SHA-1: `${{ env.SHA1_HASH }}`
            SHA-256: `${{ env.SHA256_HASH }}`
            MD5: `${{ env.MD5_HASH }}`
            CRC-32: `${{ env.CRC32_HASH }}`

            NOTICE: This is a pre-release version of the mod and is not
            guaranteed to be stable or permanently available for download/usage.
            Pre-release versions of ${{ env.MOD_NAME }} may be removed or unavailable after
            90 days from their initial release.

            NOTICE: This is an unofficial fork of Moving Elevators by SuperMartijn642,
            maintained by Mica Technologies for Forge 1.12 only. It is not affiliated with
            or endorsed by SuperMartijn642. Do not report issues with this build to the
            upstream project.
          # As above: a draft with nothing attached, filled by the upload step and published
          # once the file is verified to be there.
          draft: true
          prerelease: true
          generate_release_notes: true

      # WHY THE ASSET IS NOT ATTACHED BY THE ACTION ABOVE
      #
      # softprops/action-gh-release uploads assets in parallel through a temp dir and, under the
      # Node 24 runtime GitHub now forces, loses some of them: CSM's 2026-09-17 release came out
      # with 8 of 10 jars attached, still a draft, and the run read as a build failure. With one
      # jar the race has less to lose, but a release with no jar is still a release the launcher
      # manifests point at and cannot download. So the entry above is created as an empty draft
      # and the jar goes up here, where a failure is a failure rather than a missing asset nobody
      # notices, and where a retry is possible. The draft is only published once the asset is
      # confirmed present.
      - name: Upload the release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ env.CHOSEN_TAG }}"
          file="${{ env.RELEASE_JAR }}"
          if [ ! -f "$file" ]; then
            echo "::error::$file was listed for upload but is not there"
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "==> uploading $file (attempt $attempt)"
            if gh release upload "$tag" "$file" --repo "${{ github.repository }}" --clobber; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::giving up on $file after 3 attempts"
              exit 1
            fi
            sleep $(( attempt * 5 ))
          done

      # The uploader has been seen to report success for files it did not attach, so the release
      # is read back from the API rather than trusted. Only assets whose state is `uploaded`
      # count: GitHub lists one still uploading, or one that failed, with a different state. This
      # runs before the release is published, so a short release is never visible to anyone.
      - name: Verify the release has the jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ env.CHOSEN_TAG }}"
          repo="${{ github.repository }}"

          attached=$(gh release view "$tag" --repo "$repo" --json assets \
            --jq '[.assets[] | select(.state == "uploaded")] | length')
          echo "==> $tag has $attached of 1 assets"
          gh release view "$tag" --repo "$repo" --json assets \
            --jq '.assets[] | "    \(.name) \(.size) \(.state)"'

          if [ "$attached" -ne 1 ]; then
            echo "::error::$tag has $attached uploaded assets, expected 1"
            exit 1
          fi
          name=$(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[0].name')
          if [ "$name" != "${{ env.RELEASE_JAR }}" ]; then
            echo "::error::$tag's asset is '$name', expected '${{ env.RELEASE_JAR }}'"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ env.CHOSEN_TAG }}"
          gh release edit "$tag" --repo "${{ github.repository }}" --draft=false

          isDraft=$(gh release view "$tag" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft')
          if [ "$isDraft" != "false" ]; then
            echo "::error::$tag is still a draft"
            exit 1
          fi
          echo "==> published $tag"
