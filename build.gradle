plugins {
    id "eclipse"
    id "idea"
    id "java-library"
    id "net.minecraftforge.gradle" version "6.0.25"
    id "org.spongepowered.mixin" version "0.7.+"
}

// ---------------------------------------------------------------------------
// Mod version resolution (Mica Technologies fork)
//
// The GitHub Actions workflows create a git tag immediately before building, so the
// version that ends up in the jar name, mcmod.info and the release entry all come from
// that tag. Resolution order:
//
//   1. -PmodVersionOverride=... or the MOD_VERSION environment variable -- escape hatch
//      for one-off builds; nothing in CI sets it today.
//   2. The newest release-shaped git tag on HEAD: 'YYYY.MM.DD' for a release,
//      'YYYY.MM.DD-pre.HHMM.<tz>+<sha>' for a pre-release. Matching is restricted to that
//      shape so upstream's 'archive/1.16.1'-style tags can never be picked up.
//   3. mod_version from gradle.properties -- the upstream base version this fork sits on.
//      This is what a fresh clone with no Mica tags (and every local dev build) gets.
//
// Everything downstream keeps reading the plain `mod_version` property, so the resolved
// value flows into processResources and prepareDataResources unchanged.
// ---------------------------------------------------------------------------

/** Release/pre-release tags created by .github/workflows/. Deliberately narrow. */
ext.micaReleaseTagGlob = "20[0-9][0-9].[0-9][0-9].[0-9][0-9]*"

/** Runs a git command in the project root, returning trimmed stdout or null on any failure. */
ext.runGit = { List<String> args ->
    try {
        def stdout = new ByteArrayOutputStream()
        def stderr = new ByteArrayOutputStream()
        def process = (["git"] + args).execute(null, project.rootDir)
        process.waitForProcessOutput(stdout, stderr)
        return process.exitValue() == 0 ? stdout.toString().trim() : null
    } catch (Exception ignored) {
        // git missing, or this is a source archive rather than a checkout
        return null
    }
}

ext.resolveModVersion = {
    String override = (project.findProperty("modVersionOverride") ?: System.getenv("MOD_VERSION")) as String
    if (override?.trim())
        return override.trim()

    // Tags on HEAD first: that is the case in CI, where the tag was just pushed.
    List<String> candidates = []
    String pointsAt = runGit(["tag", "--points-at", "HEAD", "--list", micaReleaseTagGlob])
    if (pointsAt)
        candidates = pointsAt.readLines()*.trim().findAll { !it.isEmpty() }

    // Otherwise the most recent reachable tag, so local builds off a tagged history still
    // identify themselves sensibly.
    if (candidates.isEmpty()) {
        String described = runGit(["describe", "--tags", "--abbrev=0", "--match", micaReleaseTagGlob])
        if (described)
            candidates = [described]
    }

    if (!candidates.isEmpty()) {
        // A full release tag outranks a pre-release tag sitting on the same commit;
        // otherwise take the highest-sorting tag.
        return candidates.toSorted { a, b ->
            (a.contains("-pre.") <=> b.contains("-pre.")) ?: (b <=> a)
        }.first()
    }

    return mod_version
}

project.setProperty("mod_version", resolveModVersion())

version = mod_version + "-forge-" + minecraft_suffix
group = maven_group
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(java_target)

println("Java: " + System.getProperty("java.version") + " JVM: " + System.getProperty("java.vm.version") + "(" + System.getProperty("java.vendor") + ") Arch: " + System.getProperty("os.arch"))

// Keep parameter names when compiling
compileJava.options.compilerArgs.add '-parameters'

repositories {
    flatDir { dirs "libs" }
    maven { url "https://www.cursemaven.com" }
    exclusiveContent {
        forRepository {
            maven { url = "https://api.modrinth.com/maven" }
        }
        filter { includeGroup "maven.modrinth" }
    }
    maven { url = "https://repo.spongepowered.org/maven" }
}

dependencies {
    // Forge
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // SpongePowered Mixin
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    implementation("org.spongepowered:mixin:0.8.3-SNAPSHOT") {
        exclude module: "guava"
        exclude module: "commons-io"
        exclude module: "gson"
    }

    // Core library
    implementation fg.deobf("curse.maven:supermartijn642s-core-lib-454372:${core_library_file}")
    // Config library
    implementation fg.deobf("curse.maven:supermartijn642s-config-lib-438332:${config_library_file}")

    // Just Enough Items
//    runtimeOnly fg.deobf("curse.maven:jei-238222:${just_enough_items_file}")
}

// Include resources generated by data generators.
sourceSets.main {
    resources.srcDir "src/generated/resources"
    // Make sure resources are available for 1.12
    output.setResourcesDir output.classesDirs.asPath
}

processResources {
    inputs.property "version", version

    // Replace the mod version
    Map<String, ?> copyProperties = project.properties.clone() as Map<String, ?>
    //noinspection UnnecessaryQualifiedReference
    String rawModVersion = copyProperties.mod_version as String
    //noinspection UnnecessaryQualifiedReference
    var matcher = java.util.regex.Pattern.compile("[^.0-9]").matcher(rawModVersion)
    // Upstream rewrites '1.4.9a' into '1.4.9+a' so mcmod.info carries a comparable version.
    // Skip that when the suffix already opens with a SemVer separator: the release tags this
    // fork builds from ('2026.08.06-pre.0742.UTC+0000+<sha>') are well-formed already and
    // would otherwise be mangled into '2026.08.06+-pre....'.
    if (matcher.find() && !(rawModVersion.substring(matcher.start()) =~ /^[-+]/))
        copyProperties.mod_version = rawModVersion.substring(0, matcher.start()) + "+" + rawModVersion.substring(matcher.start())

    // NOTE (Mica fork): `expand` below substitutes project properties into mcmod.info,
    // modid.mixins.json and pack.mcmeta, but upstream declared only `version` as a task input.
    // Gradle therefore considered this task UP-TO-DATE after a gradle.properties edit, and
    // silently packaged stale metadata -- changing mod_description had no effect on the jar until
    // something else forced a re-run. Declare the values that actually feed `expand`.
    inputs.property "expandedProperties", copyProperties.findAll { it.value instanceof String }

    filesMatching(["mcmod.info", "modid.mixins.json", "pack.mcmeta"]) {
        expand copyProperties
    }

    exclude "**/*.pdn"

    rename "^modid.mixins.json\$", "${mod_id}.mixins.json"
    rename "^icon.png\$", "${mod_id}.png"
}

minecraft {
    mappings channel: mappings_channel, version: mappings_version

    accessTransformer = file("src/main/resources/META-INF/accesstransformer.cfg")

    String resolved_core_plugin = "${mod_package}.${coremod_package}.${coremod_class}"
    String resolved_core_config = "${mod_id}.mixins.json"

    // Make sure the core lib's mixins get applied
    String core_lib_core_mod = "com.supermartijn642.core.coremod.CoreModPlugin"

    runs {
        configureEach {
            workingDirectory file("run")

            property "forge.logging.markers", "REGISTRIES"
            property "fml.coreMods.load", resolved_core_plugin + "," + core_lib_core_mod

            args "--mixin", resolved_core_config

            mods {
                //noinspection GroovyAssignabilityCheck
                source sourceSets.main
            }
        }

        client {
        }

        server {
        }

        data {
            //noinspection GroovyAssignabilityCheck
            parent runs.client
            property "--generatorModid", mod_id
            property "--output", file("src/generated/resources/")
            //noinspection GroovyAssignabilityCheck
            property "--existing", layout.buildDirectory.file("data_resources").map { it.asFile }.get()
        }
    }
}

// NOTE (Mica fork): the build-directory paths in this task, in prepareDataResources and in the
// data run's "--existing" property were written upstream as "/sources" and "/data_resources".
// A leading slash makes Gradle resolve them as absolute paths, so on Linux and macOS the build
// tries to create /sources at the filesystem root and dies with "Failed to create directory".
// It only goes unnoticed upstream because Windows resolves a bare "/..." onto the current drive.
// Keep these relative -- the GitHub Actions runners are Ubuntu, so re-adding the slash on an
// upstream merge breaks every CI build.
tasks.register('processSources', Sync) {
    from sourceSets.main.java
    into layout.buildDirectory.dir("sources")
    inputs.property 'version', version

    // Replace mod properties in main mod class
    Hashtable<String, String> properties = new Hashtable<>()
    project.properties.entrySet().stream()
        .filter(entry -> entry.key instanceof String && entry.value instanceof String)
        .forEach(entry -> properties.put(entry.key, entry.value as String))
    filesMatching(mod_package.replace('.', '/') + "/" + mod_main_class + ".java") {
        //noinspection UnnecessaryQualifiedReference
        filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: properties)
    }
}

compileJava {
    source = processSources.outputs
}

mixin {
    // MixinGradle Settings
    add sourceSets.main, "${mod_id}.mixins.refmap.json"
    config "${mod_id}.mixins.json"
}

// Rename the IntelliJ run configs
gradle.taskGraph.whenReady {
    tasks.genIntellijRuns.doLast {
        def configDir = it.getRunConfigurationsFolder().get().getAsFile()
        minecraft.runs.each {
            //noinspection GroovyAssignabilityCheck
            def configFile = new File(configDir, it.getUniqueFileName() + ".xml")
            if (configFile.exists()) {
                def xml = new groovy.xml.XmlSlurper().parse(configFile)
                //noinspection GrUnresolvedAccess
                xml.configuration.@name = "Forge " + it.name.capitalize()
                configFile.withWriter { groovy.xml.XmlUtil.serialize(xml, it) }
            }
        }
    }
}

jar {
    from {
        configurations.compileClasspath
            .filter { "mixin-0.8.3-SNAPSHOT.jar" == it.name }
            .collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude "LICENSE.txt", "META-INF/MANIFSET.MF", "META-INF/maven/**", "META-INF/*.RSA", "META-INF/*.SF"
    }

    manifest {
        attributes "FMLCorePlugin": "com.supermartijn642.movingelevators.core.CoreMod"
        attributes "FMLCorePluginContainsFMLMod": "true"
        attributes "ForceLoadAsMod": "true"
        attributes "TweakClass": "org.spongepowered.asm.launch.MixinTweaker"
        attributes "TweakOrder": "0"
        attributes "MixinConfigs": "movingelevators.mixins.json"
    }
}

jar.finalizedBy('reobfJar')


tasks.register('prepareDataResources', Sync) {
    from file("src/main/resources")
    into layout.buildDirectory.dir("data_resources")
    inputs.property "version", version

    // Replace the mod version
    Map<String, ?> copyProperties = project.properties.clone() as Map<String, ?>
    //noinspection UnnecessaryQualifiedReference
    String rawModVersion = copyProperties.mod_version as String
    //noinspection UnnecessaryQualifiedReference
    var matcher = java.util.regex.Pattern.compile("[^.0-9]").matcher(rawModVersion)
    // Upstream rewrites '1.4.9a' into '1.4.9+a' so mcmod.info carries a comparable version.
    // Skip that when the suffix already opens with a SemVer separator: the release tags this
    // fork builds from ('2026.08.06-pre.0742.UTC+0000+<sha>') are well-formed already and
    // would otherwise be mangled into '2026.08.06+-pre....'.
    if (matcher.find() && !(rawModVersion.substring(matcher.start()) =~ /^[-+]/))
        copyProperties.mod_version = rawModVersion.substring(0, matcher.start()) + "+" + rawModVersion.substring(matcher.start())

    // NOTE (Mica fork): `expand` below substitutes project properties into mcmod.info,
    // modid.mixins.json and pack.mcmeta, but upstream declared only `version` as a task input.
    // Gradle therefore considered this task UP-TO-DATE after a gradle.properties edit, and
    // silently packaged stale metadata -- changing mod_description had no effect on the jar until
    // something else forced a re-run. Declare the values that actually feed `expand`.
    inputs.property "expandedProperties", copyProperties.findAll { it.value instanceof String }

    filesMatching(["mcmod.info", "modid.mixins.json", "pack.mcmeta"]) {
        expand copyProperties
    }

    exclude "**/*.pdn"

    rename "^modid.mixins.json\$", "${mod_id}.mixins.json"
    rename "^icon.png\$", "${mod_id}.png"
}

// Run prepareDataResources before prepareRunData
tasks.configureEach {
    if (it.name == "prepareRunData" || it.name == "prepareRunDataCompile")
        it.dependsOn "prepareDataResources"
}

// Force the jar to be reobfuscated
jar.finalizedBy('reobfJar')

// NOTE (Mica fork): upstream's `publishMods` block was removed here, along with the
// me.modmuss50.mod-publish-plugin plugin and the publishing_* / curseforge_* / modrinth_*
// properties in gradle.properties. It was configured with SuperMartijn642's own CurseForge
// (373051) and Modrinth (9KZOe6HD) project IDs, so running it would have published this fork's
// builds to his listings. We have no CurseForge or Modrinth projects of our own; releases are
// published to GitHub Releases by .github/workflows/. Re-add it only alongside real project IDs.

// ---------------------------------------------------------------------------
// Dev run classpath (Mica Technologies fork)
//
// ForgeGradle's run tasks take their classpath from sourceSets.main.runtimeClasspath. On this
// project that resolves the project's own output to build/libs/<jar> instead of
// build/classes/java/main, and two things then go wrong -- either of which alone stops the mod
// loading in a dev run:
//
//   * reobfJar rewrites that jar in place, so its classes carry SRG names (func_175664_x) while the
//     dev environment is deobfuscated.
//   * Its manifest declares a TweakClass. FML's CoreModManager.discoverCoreMods adds ANY jar
//     declaring one to ignoredModFiles and `continue`s, before reaching the branch that would treat
//     an FMLCorePluginContainsFMLMod jar as a mod candidate -- so the @Mod inside is never found.
//     (ForceLoadAsMod is not an escape hatch; FML 1.12.2 does not read it.)
//
// The symptom is runClient/runServer/runData starting with the mod silently absent. For runData
// that surfaces as "Found 0 generators for modid 'movingelevators'" followed by a non-zero exit,
// which is why datagen could not be run.
//
// So put the dev-mapped classes on the run classpath and take the production jar off it. This
// deliberately touches only the runtime classpath: `jar` builds from sourceSets.main.output and is
// unaffected.
// ---------------------------------------------------------------------------
// Applied from gradle.projectsEvaluated, not afterEvaluate: ForgeGradle rewires the runtime
// classpath after every project's afterEvaluate has run, so assigning any earlier is silently
// overwritten. Callbacks fire in registration order and the plugins register theirs while being
// applied, i.e. before this one.
gradle.projectsEvaluated {
    tasks.matching { it.name in ["runClient", "runServer", "runData"] }.configureEach {
        doFirst {
            def productionJarDir = layout.buildDirectory.dir("libs").get().asFile
            classpath = files(sourceSets.main.output) +
                classpath.filter { file -> file.parentFile == null || file.parentFile != productionJarDir }
        }
    }
}

// ---------------------------------------------------------------------------
// Tools for GitHub Actions (Mica Technologies fork)
//
// The release workflows shell out to these to name the jar and fill in the release body.
// Their names are a contract with .github/workflows/build-mod-release-pre-release-main.yml
// -- renaming one breaks the release build. Note that this build script prints a JVM banner
// during configuration which `-q` does not suppress, so the workflow reads the last line
// only (`| tail -n 1 | xargs`).
// ---------------------------------------------------------------------------
tasks.register("printModVersion") {
    group = "other"
    description = "Prints the full project version, e.g. 2026.08.06-forge-mc1.12"
    doLast { println project.version }
}

tasks.register("printArchivesBaseName") {
    group = "other"
    description = "Prints the jar's base name, e.g. movingelevators"
    doLast { println project.base.archivesName.get() }
}

tasks.register("printModName") {
    group = "other"
    description = "Prints the human-readable mod name, e.g. Moving Elevators"
    doLast { println mod_name }
}

tasks.register("printMinecraftVersion") {
    group = "other"
    description = "Prints the targeted Minecraft version, e.g. 1.12.2"
    doLast { println minecraft_version }
}
