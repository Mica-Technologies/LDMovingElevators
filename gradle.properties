# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# CI toolchain discovery. ForgeGradle 6 needs Gradle itself on JDK 17+, while the mod
# compiles against a Java 8 toolchain (java_target below). actions/setup-java exports the
# JDKs it installs as JAVA_HOME_<version>_<arch>, which Gradle does not auto-detect, so
# point it at them explicitly. Harmless locally, where these variables don't exist and
# Gradle falls back to its normal detection (plus foojay auto-provisioning).
org.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64

# Minecraft
minecraft_version=1.12.2
minecraft_dependency=[1.12,1.13)
minecraft_suffix=mc1.12
java_target=8
java_dependency=>=8
resource_pack_format=3

# Forge
forge_version=14.23.5.2860
forge_dependency=[14.23.5.2779,)
mappings_channel=snapshot
mappings_version=20171003-1.12

# Mixin
mixin_minimum_version=0.7
mixin_package=mixin
mixin_compatibility_level=JAVA_8
mixin_plugin=MovingElevatorsMixinPlugin
coremod_package=core
coremod_class=CoreMod

# Mod properties
mod_name=Moving Elevators
mod_description=Moving Elevators allows you to build real moving elevators! The elevator will move you as well as other entities on the platform to multiple floors at the press of a button! The platform can have different sizes and can move at different speeds!
mod_id=movingelevators
# Fallback version only. Release builds take their version from the git tag the GitHub
# Actions workflow creates (YYYY.MM.DD); see the resolution block at the top of build.gradle.
# This value is what local builds and untagged clones get, and it records the upstream
# SuperMartijn642 release this fork currently sits on -- bump it when merging upstream.
mod_version=1.4.12
mod_license=All rights reserved
mod_page=https://www.curseforge.com/minecraft/mc-mods/moving-elevators
mod_sources=https://github.com/SuperMartijn642/MovingElevators
mod_issues=https://github.com/SuperMartijn642/MovingElevators/issues
mod_package=com.supermartijn642.movingelevators
mod_main_class=MovingElevators
maven_group=com.supermartijn642

# Publishing
publishing_release_type=stable
publishing_game_versions=1.12 1.12.1 1.12.2
curseforge_project_id=373051
curseforge_required_dependency_ids=supermartijn642s-core-lib supermartijn642s-config-lib
curseforge_optional_dependency_ids=
modrinth_project_id=9KZOe6HD
modrinth_required_dependency_ids=supermartijn642s-core-lib supermartijn642s-config-lib
modrinth_optional_dependency_ids=

# Dependencies
core_library_file=5102240
core_library_dependency=[1.1.17,1.2.0)
config_library_file=4715393
config_library_dependency=[1.1.6,)

# Runtime mods
just_enough_items_file=4393461
